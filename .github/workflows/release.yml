name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    # Needs Xcode 26+.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import signing certificate (skipped when the secrets are missing → ad-hoc build)
        env:
          P12_BASE64: ${{ secrets.MAC_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MAC_CERT_P12_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ]; then echo "No certificate secret: building ad-hoc signed."; exit 0; fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/signing.p12"
          curl -sSLo "$RUNNER_TEMP/wwdr.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$RUNNER_TEMP/wwdr.cer" -k "$KEYCHAIN" -T /usr/bin/codesign || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          TEAM=$(security find-certificate -c "Apple Development" -p "$KEYCHAIN" | openssl x509 -noout -subject | sed -n 's/.*OU *= *\([A-Z0-9]*\).*/\1/p')
          printf 'CODE_SIGN_STYLE = Manual\nCODE_SIGN_IDENTITY = Apple Development\nDEVELOPMENT_TEAM = %s\nPROVISIONING_PROFILE_SPECIFIER =\n' "$TEAM" > Local.xcconfig
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build DMG
        run: make dmg

      - name: Show signature
        run: codesign -dvv build/Release/Build/Products/Release/ScreenshotXX.app 2>&1 | grep -E "Signature|^Authority|TeamIdentifier" || true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/ScreenshotXX-*.dmg build/ScreenshotXX-*.dmg.sha256 --title "ScreenshotXX $GITHUB_REF_NAME" --generate-notes
