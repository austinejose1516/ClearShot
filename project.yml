name: ClearShot
options:
  bundleIdPrefix: com.austinejose
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  disabledValidations: [missingConfigFiles]
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_APP_SANDBOX: NO
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 3.1.0
  ClearShotCore:
    path: Packages/ClearShotCore
targets:
  ClearShot:
    type: application
    platform: macOS
    sources:
      - path: ClearShot
        excludes: ["Info.plist"]
    dependencies:
      - package: KeyboardShortcuts
      - package: ClearShotCore
    info:
      path: ClearShot/Info.plist
      properties:
        CFBundleDisplayName: ClearShot
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 Austine Jose"
        NSMicrophoneUsageDescription: "ClearShot records your voice when a recording has the microphone on."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.austinejose.clearshot
        PRODUCT_NAME: ClearShot
        MARKETING_VERSION: "0.11.0"
        CURRENT_PROJECT_VERSION: "12"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
schemes:
  ClearShot:
    build:
      targets:
        ClearShot: all
    run:
      config: Debug
